<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Prompt Academy"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Prompt Engineering Academy</title></head><body style="margin:0;background:#07111f;color:#e7edf6;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><div id="boot" style="padding:24px">Загрузка курса…</div><script>const parts=["app-01.part","app-02.part","app-03.part","app-04.part","app-05.part","app-06.part","app-07.part","app-08.part"];(async()=>{try{const a=await Promise.all(parts.map(x=>fetch(x+'?v=7').then(r=>{if(!r.ok)throw Error(x);return r.text()})));const b=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let h=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();h=h.replace('body{padding-bottom:82px}','body{padding-bottom:148px}');h=h.replace('display:grid;grid-template-columns:repeat(5,1fr);position:fixed;','display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,auto);position:fixed;');h=h.replace(/<nav class="mobile-nav" id="mobileNav">[\s\S]*?<\/nav>/,`<nav class="mobile-nav" id="mobileNav"><button data-view="course" class="active">📚<br>Курс</button><button data-view="trainer">🎯<br>Практика</button><button data-view="quiz">📝<br>Квизы</button><button data-view="cards">🧠<br>Карточки</button><button data-view="evaluator">🔎<br>Оценка</button><button data-view="exams">🏆<br>Экзамены</button><button data-view="engineering">🏗<br>Инженер</button><button data-view="stats">📊<br>Прогресс</button></nav>`);const addon=`<style>@media(max-width:620px){.lesson-side #completeLessonBtn,.lesson-side #nextLessonBtn{display:inline-block;width:calc(50% - 5px);padding:10px 8px;font-size:14px}.lesson-side #nextLessonBtn{margin-left:6px}}</style><script>(function(){function addNext(){const complete=document.getElementById('completeLessonBtn');if(!complete||document.getElementById('nextLessonBtn'))return;const btn=document.createElement('button');btn.id='nextLessonBtn';btn.className='btn primary';btn.textContent='▶ Продолжить';btn.addEventListener('click',function(){const all=allLessons();const idx=all.findIndex(x=>x.lesson.id===state.lastLesson);const next=all[idx+1];if(next)openLesson(next.module,next.lesson);else showView('course')});complete.insertAdjacentElement('afterend',btn)}new MutationObserver(addNext).observe(document.body,{childList:true,subtree:true});addNext()})();<\/script>`;h=h.replace('</body>',addon+'</body>');document.open();document.write(h);document.close();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=7').catch(console.error)}catch(e){document.getElementById('boot').textContent='Ошибка загрузки курса: '+e.message}})();</script></body></html>
