<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Prompt Academy"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Prompt Engineering Academy</title></head><body style="margin:0;background:#07111f;color:#e7edf6;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><div id="boot" style="padding:24px">Загрузка курса…</div><script>const parts=["app-01.part", "app-02.part", "app-03.part", "app-04.part", "app-05.part", "app-06.part", "app-07.part", "app-08.part"];(async()=>{try{const a=await Promise.all(parts.map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x);return r.text()})));const b=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const h=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(h);document.close();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error)}catch(e){document.getElementById('boot').textContent='Ошибка загрузки курса: '+e.message}})();</script></body></html>
